spring.application.name=viger-app
server.port=8000
spring.thymeleaf.cache=false
spring.freemarker.cache=false

# ==================================================
# Cấu hình kết nối MySQL
# Thay đổi url, username, password cho phù hợp môi trường của bạn
# ==================================================
spring.datasource.url=jdbc:mysql://localhost:8000/viger_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# Cấu hình JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
