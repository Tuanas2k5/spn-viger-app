spring.application.name=viger-app
server.port=8080
spring.thymeleaf.cache=false
spring.freemarker.cache=false

# ==================================================
# Cấu hình kết nối MySQL
# Thay đổi url, username, password cho phù hợp môi trường của bạn
# ==================================================
spring.datasource.url=jdbc:mysql://localhost:8000/viger_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==================================================
# Cấu hình JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
