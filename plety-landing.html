<body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Hook for Scroll Reveal
        function useScrollReveal() {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1 }
                );
                
                if (ref.current) {
                    observer.observe(ref.current);
                }
                
                return () => {
                    if (ref.current) {
                        observer.unobserve(ref.current);
                    }
                };
            }, []);

            return { ref, isVisible };
        }

        const FadeInUp = ({ children, className = "" }) => {
            const { ref, isVisible } = useScrollReveal();
            return (
                <div ref={ref} className={`fade-in-up ${isVisible ? 'visible' : ''} ${className}`}>
                    {children}
                </div>
            );
        };

        const Logo = () => (

        const DummyLogo = ({ name }) => (
            <div className="flex items-center gap-2">

                    <polygon points="12 2 2 22 22 22" />
                </svg>
                <span className="font-semibold text-lg text-slate-800">{name}</span>
            </div>
        );

        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 20);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const handleNavClick = (id) => {
                setIsMobileMenuOpen(false);
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-white/80 backdrop-blur-md border-b border-slate-200/50 py-3' : 'bg-transparent py-5'}`}>

                        </div>
                        
                        <div className="hidden md:flex items-center space-x-8">

                                <button key={item} onClick={() => handleNavClick(item.toLowerCase())} className="text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">

                                </button>
                            ))}
                        </div>

                        <div className="hidden md:block">
                            <button className="bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-5 py-2.5 rounded-full shadow-sm transition-colors">
                                Get started
                            </button>
                        </div>

                        <div className="md:hidden">
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-slate-900 p-2 focus:outline-none">

                                    )}

                                        <div className="flex items-center gap-1 mt-1 h-4">
                                            {[...Array(12)].map((_, i) => (
                                                <div key={i} className="w-1 bg-slate-400 rounded-full" style={{height: `${Math.max(20, Math.random() * 100)}%`}}></div>

                                    "So the key takeaway here is that we need to align the quarterly goals with the new infrastructure updates before Q3 begins."

                        </div>
                    </FadeInUp>
                    <FadeInUp className="order-1 lg:order-2">

                        </p>
                        <button className="text-slate-900 font-medium hover:text-slate-700 flex items-center gap-2 group">

                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>

        const AccordionItem = ({ question, answer, isOpen, onClick, isLast }) => (

                        <svg

                        </svg>
                    </span>
                </button>
                <div className={`accordion-content ${isOpen ? 'open' : ''}`}>
                    <div>
                        <p className="text-slate-500 text-sm pb-6 px-6">

        );

        const FAQ = () => {
            const [openIndex, setOpenIndex] = useState(0);

            const faqs = [
                { q: "Is my data safe and private?", a: "Yes, we use enterprise-grade encryption for all data in transit and at rest. We never use your proprietary data to train our foundational models without explicit consent." },
